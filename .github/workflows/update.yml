name: Оновлення новин
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    paths: ["feeds.json", "scripts/fetch.py"]
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch.py
      - name: Зберегти зміни
        run: |
          git config user.name "dobirka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data feeds
          git diff --cached --quiet || (git commit -m "Оновлення новин" && git pull --rebase && git push)
